# 모노레포용 워크플로우: course-service/ (또는 의존 라이브러리) 변경 시에만 실행
name: course-service CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'course-service/**'
      - 'libs/common-security/**'
      - '.github/workflows/course-service.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'course-service/**'
      - 'libs/common-security/**'
      - '.github/workflows/course-service.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: course-service

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Start RabbitMQ
        uses: mer-team/rabbitmq-mng-action@v1.2
        with:
          RABBITMQ_USER: 'guest'
          RABBITMQ_PASS: 'guest'
          RABBITMQ_PORT: 5672
          RABBITMQ_MNG_PORT: 15672
          RABBITMQ_TAG: '3-management-alpine'

      - name: Start Redis
        uses: supercharge/redis-github-action@1.1.0
        with:
          redis-version: 7

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      - name: Login docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker image
        run: docker build -t devhong96/scheduler-course-service .
      - name: Publish to docker hub
        run: docker push devhong96/scheduler-course-service:latest

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          build-root-directory: course-service
