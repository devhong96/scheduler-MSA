# 모노레포용 워크플로우: apigateway/ (또는 의존 라이브러리) 변경 시에만 실행
name: apigateway CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'apigateway/**'
      - '.github/workflows/apigateway.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'apigateway/**'
      - '.github/workflows/apigateway.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apigateway

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      - name: Login docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker image
        run: docker build -t devhong96/scheduler-apigateway-service .
      - name: Publish to docker hub
        run: docker push devhong96/scheduler-apigateway-service:latest

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          build-root-directory: apigateway
